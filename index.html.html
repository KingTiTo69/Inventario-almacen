<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario del Almacén</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#1f6feb;--bd:#e2e5ea;--bad:#d93025;--ok:#188038;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232a;--tx:#eef1f5;--mu:#98a2b3;--bd:#2d343d;--ac:#4c8dff}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e232a;--tx:#eef1f5;--mu:#98a2b3;--bd:#2d343d;--ac:#4c8dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:22px;margin:0;flex:1;min-width:180px}
.sub{color:var(--mu);font-size:14px;margin-top:2px}
input,button{font:inherit}
input[type=search],input[type=text],input[type=number]{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;font-size:16px}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.del{background:var(--bad)}
#q{margin-top:10px}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:14px;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.b{padding:12px;display:flex;flex-direction:column;gap:10px}
.n{font-weight:700;font-size:17px;word-break:break-word}
.st{display:flex;align-items:center;justify-content:space-between;gap:8px}
.st button{width:52px;height:52px;padding:0;font-size:28px;line-height:1}
.qt{font-size:30px;font-weight:800;text-align:center;flex:1}
.qt.z{color:var(--bad)}
.qt small{display:block;font-size:11px;font-weight:500;color:var(--mu)}
.ed{align-self:flex-start;background:none;color:var(--ac);padding:4px 0;font-size:14px}
.add{border:2px dashed var(--bd);background:transparent;color:var(--ac);min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:18px;font-weight:700;cursor:pointer;border-radius:14px}
.add span{font-size:44px;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.m{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.m h2{margin:0;font-size:20px}
.m label{font-size:14px;color:var(--mu);display:block;margin-bottom:4px}
#pv{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--bd);display:none}
textarea{width:100%;height:140px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);padding:8px;font-size:12px}
.warn{background:#fff3cd;color:#664d03;padding:8px 16px;font-size:14px;display:none}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:30px}
</style>
</head>
<body>
<div class="warn" id="warn">⚠ Este navegador no permite guardar datos: los cambios se perderán al cerrar.</div>
<header>
  <div class="row">
    <div style="flex:1;min-width:180px"><h1>📦 Inventario del Almacén</h1><div class="sub" id="tot"></div></div>
    <button class="sec" id="bk">Copia de seguridad</button>
    <button id="nw">+ Nueva pieza</button>
  </div>
  <input type="search" id="q" placeholder="🔍 Buscar pieza por nombre…">
</header>
<main id="g"></main>

<div class="ov" id="ov"><div class="m">
  <h2 id="mt">Nueva pieza</h2>
  <img id="pv" alt="">
  <div><label>Foto (hacer foto o elegir de la galería)</label><input type="file" id="f" accept="image/*"></div>
  <div><label>Nombre de la pieza</label><input type="text" id="nm" placeholder="Ej: Tornillo M8 x 40"></div>
  <div><label>Cantidad en el almacén</label><input type="number" id="qn" min="0" inputmode="numeric" value="0"></div>
  <div class="row"><button id="sv" style="flex:1">Guardar</button><button class="sec" id="cx">Cancelar</button></div>
  <button class="del" id="dl" style="display:none">Eliminar pieza</button>
</div></div>

<div class="ov" id="ov2"><div class="m">
  <h2>Copia de seguridad</h2>
  <div class="sub">Copia este texto y guárdalo (por ejemplo, envíalo por correo). Para restaurar, elige el archivo o pega el texto.</div>
  <textarea id="ta" readonly></textarea>
  <button id="cp">Copiar texto</button>
  <div><label>Restaurar desde archivo .json</label><input type="file" id="imp" accept=".json,application/json"></div>
  <button class="sec" id="c2">Cerrar</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
let db=null,items=[],editId=null,photo='';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('almacen',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function store(m){return db.transaction('p',m).objectStore('p')}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function persist(o){if(!db)return;try{await req(store('readwrite').put(o))}catch(e){$('warn').style.display='block'}}
async function remove(id){if(!db)return;try{await req(store('readwrite').delete(id))}catch(e){}}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const list=items.filter(p=>p.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  $('tot').textContent=items.length+' tipos de pieza · '+items.reduce((s,p)=>s+p.qty,0)+' unidades en total';
  let h=list.map(p=>`<div class="c" data-id="${p.id}">
    <div class="ph" data-a="ed">${p.img?`<img src="${p.img}" alt="">`:'Sin foto'}</div>
    <div class="b"><div class="n">${esc(p.name)}</div>
    <div class="st"><button data-a="m">−</button><div class="qt ${p.qty===0?'z':''}">${p.qty}<small>${p.qty===0?'SIN STOCK':'unidades'}</small></div><button data-a="p">+</button></div>
    <button class="ed" data-a="ed">✎ Editar</button></div></div>`).join('');
  h+=`<div class="add" id="ad"><span>+</span>Añadir pieza nueva</div>`;
  if(!list.length&&items.length)h=`<div class="empty">No hay piezas que coincidan con la búsqueda.</div>`+h;
  $('g').innerHTML=h;
}
function openForm(id){
  editId=id;const p=items.find(x=>x.id===id);
  $('mt').textContent=p?'Editar pieza':'Nueva pieza';
  $('nm').value=p?p.name:'';$('qn').value=p?p.qty:0;photo=p?p.img:'';$('f').value='';
  $('pv').style.display=photo?'block':'none';$('pv').src=photo||'';
  $('dl').style.display=p?'block':'none';$('ov').classList.add('on');
}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const m=700,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.75))};i.onerror=rej;i.src=u})}
$('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await shrink(f);$('pv').src=photo;$('pv').style.display='block'}catch(x){alert('No se pudo leer la foto')}};
$('sv').onclick=async()=>{
  const name=$('nm').value.trim();if(!name){$('nm').focus();return}
  const qty=Math.max(0,parseInt($('qn').value)||0);
  let p=items.find(x=>x.id===editId);
  if(p){p.name=name;p.qty=qty;p.img=photo}else{p={id:'p'+Date.now()+Math.random().toString(36).slice(2,6),name,qty,img:photo};items.push(p)}
  await persist(p);$('ov').classList.remove('on');render();
};
$('dl').onclick=async()=>{if(!confirm('¿Eliminar esta pieza?'))return;items=items.filter(x=>x.id!==editId);await remove(editId);$('ov').classList.remove('on');render()};
$('cx').onclick=()=>$('ov').classList.remove('on');
$('nw').onclick=()=>openForm(null);
$('g').onclick=async e=>{
  if(e.target.closest('#ad'))return openForm(null);
  const c=e.target.closest('.c'),b=e.target.closest('[data-a]');if(!c||!b)return;
  const p=items.find(x=>x.id===c.dataset.id),a=b.dataset.a;
  if(a==='ed')return openForm(p.id);
  p.qty=Math.max(0,p.qty+(a==='p'?1:-1));render();await persist(p);
};
$('q').oninput=render;
$('bk').onclick=()=>{$('ta').value=JSON.stringify(items);$('ov2').classList.add('on')};
$('c2').onclick=()=>$('ov2').classList.remove('on');
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('ta').value);$('cp').textContent='¡Copiado!'}catch(e){$('ta').select();document.execCommand('copy')}};
$('imp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;
    if(!confirm('Se añadirán/actualizarán '+d.length+' piezas. ¿Continuar?'))return;
    for(const o of d){if(!o.id||!o.name)continue;o.qty=+o.qty||0;const i=items.findIndex(x=>x.id===o.id);i>=0?items[i]=o:items.push(o);await persist(o)}
    $('ov2').classList.remove('on');render();
  }catch(x){alert('Archivo no válido')}
};
(async()=>{
  try{db=await openDB();items=await req(store('readonly').getAll())}catch(e){db=null;$('warn').style.display='block'}
  render();
})();
</script>
</body>
</html>
